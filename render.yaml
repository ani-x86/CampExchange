services:
  - type: web
    name: camp-exchange-server
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build:server && npm run db:deploy -w server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://camp-exchange-4dia.vercel.app
      - key: COLLEGE_EMAIL_DOMAIN
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_IMAGE_MB
        value: "5"
      - key: NLP_URL
        fromService:
          type: web
          name: camp-exchange-nlp
          property: hostport
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

  - type: pserv
    name: camp-exchange-nlp
    runtime: python
    rootDir: nlp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
